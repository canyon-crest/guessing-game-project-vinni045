<!DOCTYPE html>
<html>
  <head>
    <title>JavaScript Number Guessing Game</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <p id="date"></p> 
    <p id="currentTime"></p>  
    <input type="text" id="names" placeholder="What is your name?">
   
    <h3>Level</h3>
    <input type="radio" name="level" id="e" value="3" checked><label for="e">Easy (1-3)</label>
    <input type="radio" name="level" id="m" value="10"><label for="m">Medium (1-10)</label>
    <input type="radio" name="level" id="h" value="100"><label for="h">Hard (1-100)</label>

    <button id="playBtn">Play</button>

    <h3 id="msg">Select a Level</h3>
    <input type="text" id="guess" disabled>
    <button id="guessBtn" disabled>Guess</button>
    <button id="giveUpBtn" disabled>Give Up</button> <p id ='timer' value = '0'>Timer: </p>

    <h3>Stats</h3>
    <p id="wins">Total wins: 0</p>
    <p id="avgScore">Average Score: </p>
    <p id ='fastestWin'>Your Fastest Win: </p>
    <p id="avgTime">Average Time: </p>
    <p id="streakDisplay">Current Level Streak: 0</p>


    <h3>Leaderboard</h3>
    <div id="lb3"></div>
<ol id="ol3">
  <li>___</li>
  <li>___</li>
  <li>___</li>
</ol>
<div id="lb10"></div>
<ol id="ol10">
  <li>___</li>
  <li>___</li>
  <li>___</li>
</ol>
<div id="lb100"></div>
<ol id="ol100">
  <li>___</li>
  <li>___</li>
  <li>___</li>
</ol>

</html>
